<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">CircuitMind holdout results: top-1 and top-3 accuracy by benchmark</title>
  <desc id="desc">Bar chart of verified synthetic-data results. Instance holdout: top-1 88 percent, top-3 100 percent. Reserve: top-1 85 percent, top-3 100 percent. Fault-family holdout weighted: top-1 49 percent, top-3 84.7 percent. Discriminating: top-1 55.6 percent, top-3 100 percent.</desc>
  <rect width="720" height="400" rx="16" fill="#0d1117"/>
  <text x="36" y="40" font-family="monospace" font-size="19" font-weight="bold" fill="#e6edf3">Holdout results — synthetic data only</text>
  <text x="36" y="62" font-family="monospace" font-size="12" fill="#8b949e">Top-1 in blue, top-3 in green. Source: validation/*.json (frozen files).</text>
  <g font-family="monospace" font-size="13" fill="#e6edf3">
    <text x="36" y="102">Instance holdout · Top-1</text>
    <rect x="230" y="88" width="405" height="18" rx="4" fill="#58a6ff"/>
    <text x="645" y="102" fill="#58a6ff">88.0%</text>
    <text x="36" y="130">Instance holdout · Top-3</text>
    <rect x="230" y="116" width="460" height="18" rx="4" fill="#3fb950"/>
    <text x="36" y="158">Reserve · Top-1</text>
    <rect x="230" y="144" width="391" height="18" rx="4" fill="#58a6ff"/>
    <text x="630" y="158" fill="#58a6ff">85.0%</text>
    <text x="36" y="186">Reserve · Top-3</text>
    <rect x="230" y="172" width="460" height="18" rx="4" fill="#3fb950"/>
    <text x="36" y="214">Family holdout · Top-1</text>
    <rect x="230" y="200" width="225" height="18" rx="4" fill="#58a6ff"/>
    <text x="464" y="214" fill="#58a6ff">49.0%</text>
    <text x="36" y="242">Family holdout · Top-3</text>
    <rect x="230" y="228" width="390" height="18" rx="4" fill="#3fb950"/>
    <text x="629" y="242" fill="#3fb950">84.7%</text>
    <text x="36" y="270">Discriminating · Top-1</text>
    <rect x="230" y="256" width="256" height="18" rx="4" fill="#58a6ff"/>
    <text x="495" y="270" fill="#58a6ff">55.6%</text>
    <text x="36" y="298">Discriminating · Top-3</text>
    <rect x="230" y="284" width="460" height="18" rx="4" fill="#3fb950"/>
  </g>
  <text x="36" y="336" font-family="monospace" font-size="12" fill="#8b949e">The gap between the first two rows and the family-holdout row is the honest</text>
  <text x="36" y="354" font-family="monospace" font-size="12" fill="#8b949e">generalisation story: known families rank well; unseen families do not — yet.</text>
  <text x="36" y="382" font-family="monospace" font-size="11" fill="#6e7681">Instance: 100 boards · Reserve: 100 boards, seed 20260731 · Family: 98 boards, 14 families · Discriminating: 27 boards</text>
</svg>
